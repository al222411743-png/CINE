<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡Bienvenidos al cine de Xel!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="polvo" aria-hidden="true"></canvas>

  <main>
    <h1>¡Bienvenidos al cine de Xel!</h1>
    <p class="intro">Ingresa tu edad y elige el género que más te guste. Te recomendamos tu película ideal.</p>

    <label class="edad" for="edad">Edad
      <input id="edad" type="number" min="1" max="120" value="20" inputmode="numeric">
    </label>

    <div class="generos" role="group" aria-label="Género">
      <button class="genero" data-genero="Drama"><span>🎭</span>Drama</button>
      <button class="genero" data-genero="Comedia"><span>😂</span>Comedia</button>
      <button class="genero" data-genero="Musical"><span>🎶</span>Musical</button>
      <button class="genero" data-genero="Crimen"><span>🕵️</span>Crimen</button>
    </div>

    <section id="resultado" aria-live="polite">
      <p class="vacio">Elige un género para ver tu recomendación.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
